<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Annotated Inky browser controls</title>
  <desc id="desc">A simple diagram of Inky's browser preview controls showing play, pause, timeline, speed, PNG export, and MP4 export.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#201914" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#315d8a"/>
    </marker>
  </defs>

  <rect width="1200" height="430" fill="#fbf4e4"/>
  <rect x="46" y="84" width="1108" height="140" rx="22" fill="#f1eadc" stroke="#c9bdaa" stroke-width="2" filter="url(#shadow)"/>

  <rect x="92" y="118" width="150" height="74" rx="12" fill="#fffdf6" stroke="#c7bba9" stroke-width="2"/>
  <path d="M126 139 L126 171 L152 155 Z" fill="none" stroke="#241d18" stroke-width="5" stroke-linejoin="round"/>
  <text x="172" y="163" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#241d18">Play</text>

  <rect x="262" y="118" width="176" height="74" rx="12" fill="#31506a" stroke="#1d3448" stroke-width="2"/>
  <rect x="296" y="138" width="8" height="34" rx="2" fill="#fffdf6"/>
  <rect x="316" y="138" width="8" height="34" rx="2" fill="#fffdf6"/>
  <text x="346" y="163" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#fffdf6">Pause</text>

  <line x1="474" y1="155" x2="706" y2="155" stroke="#b6b1a8" stroke-width="8" stroke-linecap="round"/>
  <line x1="474" y1="155" x2="566" y2="155" stroke="#31506a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="566" cy="155" r="15" fill="#31506a"/>
  <text x="732" y="163" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#5b5045">Frame 19 / 96</text>

  <rect x="884" y="118" width="146" height="74" rx="12" fill="#fffdf6" stroke="#c7bba9" stroke-width="2"/>
  <path d="M918 136 L918 162 M905 151 L918 164 L931 151 M903 174 L935 174" fill="none" stroke="#241d18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="954" y="163" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#241d18">PNG</text>

  <rect x="1046" y="118" width="94" height="74" rx="12" fill="#fffdf6" stroke="#c7bba9" stroke-width="2"/>
  <rect x="1060" y="139" width="26" height="26" rx="2" fill="none" stroke="#241d18" stroke-width="4"/>
  <path d="M1069 146 L1069 158 L1080 152 Z" fill="#241d18"/>
  <text x="1094" y="162" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#241d18">MP4</text>

  <rect x="494" y="250" width="190" height="50" rx="12" fill="#fffdf6" stroke="#c7bba9" stroke-width="2"/>
  <text x="518" y="282" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#241d18">Speed: 1x</text>

  <g fill="#315d8a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">
    <text x="84" y="48">Preview the animation in your browser</text>
    <text x="128" y="286">Play / Pause</text>
    <text x="424" y="338">Scrub through frames</text>
    <text x="514" y="380">Slow down or speed up</text>
    <text x="790" y="286">Export current frame</text>
    <text x="1010" y="286">Export video</text>
  </g>

  <g stroke="#315d8a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M170 270 C170 238 174 216 192 188"/>
    <path d="M530 322 C522 282 526 222 564 174"/>
    <path d="M594 360 C590 326 590 314 590 300"/>
    <path d="M858 270 C878 232 910 214 918 188"/>
    <path d="M1058 270 C1062 236 1064 214 1072 188"/>
  </g>
</svg>
